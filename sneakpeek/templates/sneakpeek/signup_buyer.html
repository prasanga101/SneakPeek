{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <a class="brand" href="#">
      <span class="brand-mark">Sneak</span><span class="brand-mark2">Peek</span>
    </a>

    <h1 class="auth-title">Create Buyer Account</h1>
    <p class="auth-subtitle">Join SneakPeek and start bidding today.</p>

    <form class="auth-form" action="{% url 'SneakPeek-Signup' %}" method="post">
      {% csrf_token %}

      <label class="label">First Name
        <input class="input" type="text" name="first_name" required />
      </label>
      <label class="label">Last Name
        <input class="input" type="text" name="last_name" required />
      </label>
      <label class="label">Email
        <input class="input" type="email" name="email" required />
      </label>
      <label class="label">Password
        <input class="input" type="password" name="password" required />
      </label>
      <label class="label">Confirm Password
        <input class="input" type="password" name="confirm_password" required />
      </label>

      <button class="btn-primary" type="submit" style="margin-top:20px;">Create Account</button>
    </form>

    <p class="switch">
      Already have an account? <a class="link" href="{% url 'SneakPeek-Login' %}">Login</a>
    </p>
  </div>
</div>
{% endblock %}
