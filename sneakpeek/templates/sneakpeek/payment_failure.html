{% extends "base.html" %}
{% block content %}

<style>
.payment-container {
    max-width: 500px;
    margin: 80px auto;
    text-align: center;
    padding: 40px;
    background: #fff0f0;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(255, 0, 0, 0.1);
    font-family: 'Arial', sans-serif;
}

.payment-container h1 {
    font-size: 3rem;
    color: #dc3545;
    margin-bottom: 20px;
}

.payment-container p {
    font-size: 1.2rem;
    color: #333;
    margin-bottom: 30px;
}

.payment-container a.button {
    display: inline-block;
    padding: 12px 30px;
    background: #dc3545;
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: background 0.3s;
}

.payment-container a.button:hover {
    background: #b02a37;
}
</style>

<div class="payment-container">
    <h1>❌ Payment Failed</h1>
    <p>Unfortunately, your payment could not be processed. Please try again or contact support.</p>
    <a href="{% url 'SneakPeek-home' %}" class="button">Back to Marketplace</a>
</div>

{% endblock %}
