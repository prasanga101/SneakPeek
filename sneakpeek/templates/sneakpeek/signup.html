{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="auth-page">
  <div class="auth-card" style="text-align:center;">
    <a class="brand" href="#">
      <span class="brand-mark">Sneak</span><span class="brand-mark2">Peek</span>
    </a>

    <h1 class="auth-title">Sign Up</h1>
    <p class="auth-subtitle">Choose your account type to get started</p>

    <div style="display:flex; flex-direction:column; gap:20px; margin-top:30px;">
      <a href="{% url 'SneakPeek-Signup' %}" class="btn-primary" style="padding:15px; font-size:18px;">Signup as Buyer</a>
      <a href="{% url 'SneakPeek-SignupSeller' %}" class="btn-secondary" style="padding:15px; font-size:18px;">Signup as Seller</a>
    </div>

    <p style="margin-top:30px;">
      Already have an account? <a class="link" href="{% url 'SneakPeek-Login' %}">Login</a>
    </p>
  </div>
</div>
{% endblock %}
