{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if title %}
        <title>{{ title }} - SneakPeek</title>
    {% else %}
        <title>SneakPeek</title>
    {% endif %}
    <link rel="stylesheet" href="{% static 'sneakpeek/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'sneakpeek/css/auth.css' %}">
    <script src="{% static 'sneakpeek/js/main.js' %}" defer></script>
</head>
<body>
    <nav class="navbar">
    <div class="nav-left">
        <a href="{% url 'SneakPeek-home' %}" class="logo">SneakPeek</a>
    </div>

    <div class="nav-right" id="navMenu">
        <a href="{% url 'SneakPeek-home' %}">Home</a>
        <a href="{% url 'SneakPeek-marketplace' %}">Marketplace</a>
     <!------   <a href="{% url 'SneakPeek-sell' %}">Sell</a>-->
        <a href="{% url 'SneakPeek-bids' %}">My Bids</a>
        <a href="{%url 'SneakPeek-Login'%}" class="btn-outline">Login</a>
        <a href="{%url 'SneakPeek-Signup'%}" class="btn-solid">Sign Up</a>
    </div>

    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>
</nav>
    <div class="container">
        {% block content %}
        {% endblock content %}
    </div>
</body>
</html>
