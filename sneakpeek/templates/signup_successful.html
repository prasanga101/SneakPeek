{% extends 'base.html' %}
{% block content %}

<div class="auth-page">
  <div class="auth-card" style="text-align:center;">
    
    <h1 style="color:#28a745;">✅ Signup Successful</h1>

    {% if message %}
      <p style="margin-top:15px; font-size:16px; color:#555;">
        {{ message }}
      </p>
    {% else %}
      <p>Your account has been created.</p>
    {% endif %}

    <a href="{% url 'SneakPeek-Login' %}" class="btn-primary" style="margin-top:25px; display:inline-block;">
      Go to Login
    </a>

  </div>
</div>

{% endblock %}
